name: toolshop

# Application under test: Toolshop (testsmith-io/practice-software-testing), sprint5.
# This file is a rewrite of the upstream docker-compose.prod.yml with two
# deliberate swaps (see docs/adr/0002-compose-proprio-amd64.md):
#   - `web`: the upstream image is arm64-only -> official multi-arch nginx + vendored vhost
#   - `queue`: replaces the arm64 `cron` service with an explicit worker on the API image
services:
  laravel-api:
    image: testsmith/practice-software-testing-${SPRINT}-api
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=${DISABLE_LOGGING:-false}
    volumes:
      - app-code:/var/www
    depends_on:
      mariadb:
        condition: service_healthy

  angular-ui:
    image: testsmith/practice-software-testing-${SPRINT}-ui
    ports:
      - '4200:4200'
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  web:
    image: nginx:1.23.3-alpine
    ports:
      - '8091:80'
    volumes:
      - ./nginx/vhost.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel-api

  # Processes the `database` queue. Checkout dispatches the stock decrement as a
  # job (UpdateProductInventory), so it does NOT happen inside the HTTP response.
  # A long-running worker instead of the upstream 1-minute crond: same asynchrony,
  # shorter window.
  queue:
    image: testsmith/practice-software-testing-${SPRINT}-api
    restart: always
    working_dir: /var/www
    command: php artisan queue:work --sleep=1 --tries=3
    volumes:
      - app-code:/var/www
    environment:
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=${DISABLE_LOGGING:-false}
    # Shares the app-code volume with the API. On a clean environment both
    # containers race to populate the volume from the image (mkdir: file exists),
    # so this one waits for the API — the order serializes the creation.
    depends_on:
      laravel-api:
        condition: service_started

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  app-code:
