name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: fails in seconds and avoids spinning up Docker for nothing.
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format

  e2e:
    name: E2E suite
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Every step is timed. The numbers in the README come from here, measured on
      # the runner, not copied from another repository. This is also the data that
      # tells us whether caching images or sharding the suite is worth it.
      - name: Start the app (pull + up)
        run: |
          t0=$(date +%s)
          npm run app:up
          echo "UP_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Wait for the stack to be ready
        run: |
          t0=$(date +%s)
          npm run app:wait
          echo "WAIT_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      # cache:clear is required. ProductService caches product listings for 300s on
      # the file driver, and that cache SURVIVES migrate:fresh. Without the clear,
      # the API serves products that no longer exist in the database — and a broken
      # test passes.
      - name: Seed the database and clear the app cache
        run: |
          t0=$(date +%s)
          npm run app:seed
          echo "SEED_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Run the suite
        run: |
          t0=$(date +%s)
          npm test
          echo "TEST_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Publish timing breakdown
        if: always()
        run: |
          {
            echo "### Time per step"
            echo ""
            echo "| step | seconds |"
            echo "|---|---:|"
            echo "| pull + up | ${UP_S:-n/a} |"
            echo "| wait for readiness | ${WAIT_S:-n/a} |"
            echo "| seed + cache:clear | ${SEED_S:-n/a} |"
            echo "| suite | ${TEST_S:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Always, not only on failure: a spec that fails and passes on retry leaves
      # the job green, and that is exactly the case where the server side needs
      # explaining. Silence in the ambiguous case is how flakes become folklore.
      - name: App logs
        if: always()
        run: docker compose -f docker/compose.yml logs --tail=150

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Its own job, on its own runner. The Oracle image is an order of magnitude
  # larger than the rest of the stack and its first start takes minutes, so
  # attaching it to the E2E job would make every pull request pay for a database
  # most changes never touch. Separate runners also keep the two stacks from
  # competing for the same memory, which is what happens when both are started on
  # one developer machine.
  oracle:
    name: Oracle integrity
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # No browser is installed on purpose: nothing in this suite asks for a
      # page, so Playwright never launches one.
      - name: Start Oracle (pull + first init)
        run: |
          t0=$(date +%s)
          npm run oracle:up
          echo "ORACLE_UP_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Load the CO sample schema
        run: |
          t0=$(date +%s)
          npm run oracle:seed
          echo "ORACLE_SEED_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Run the integrity checks
        run: |
          t0=$(date +%s)
          npm run test:oracle
          echo "ORACLE_TEST_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Publish timing breakdown
        if: always()
        run: |
          {
            echo "### Oracle job"
            echo ""
            echo "| step | seconds |"
            echo "|---|---:|"
            echo "| pull + first init | ${ORACLE_UP_S:-n/a} |"
            echo "| load CO schema | ${ORACLE_SEED_S:-n/a} |"
            echo "| integrity checks | ${ORACLE_TEST_S:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Oracle logs
        if: always()
        run: docker compose -f docker/oracle.compose.yml logs --tail=100
