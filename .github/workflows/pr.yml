name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: fails in seconds and avoids spinning up Docker for nothing.
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format

  e2e:
    name: E2E suite
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Every step is timed. The numbers in the README come from here, measured on
      # the runner, not copied from another repository. This is also the data that
      # tells us whether caching images or sharding the suite is worth it.
      - name: Start the app (pull + up)
        run: |
          t0=$(date +%s)
          npm run app:up
          echo "UP_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Wait for the stack to be ready
        run: |
          t0=$(date +%s)
          npm run app:wait
          echo "WAIT_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      # cache:clear is required. ProductService caches product listings for 300s on
      # the file driver, and that cache SURVIVES migrate:fresh. Without the clear,
      # the API serves products that no longer exist in the database — and a broken
      # test passes.
      - name: Seed the database and clear the app cache
        run: |
          t0=$(date +%s)
          npm run app:seed
          echo "SEED_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Run the suite
        run: |
          t0=$(date +%s)
          npm test
          echo "TEST_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Publish timing breakdown
        if: always()
        run: |
          {
            echo "### Time per step"
            echo ""
            echo "| step | seconds |"
            echo "|---|---:|"
            echo "| pull + up | ${UP_S:-n/a} |"
            echo "| wait for readiness | ${WAIT_S:-n/a} |"
            echo "| seed + cache:clear | ${SEED_S:-n/a} |"
            echo "| suite | ${TEST_S:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: App logs (on failure)
        if: failure()
        run: docker compose -f docker/compose.yml logs --tail=80

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
